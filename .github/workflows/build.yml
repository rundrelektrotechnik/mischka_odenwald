# Builds the production website on every change and keeps it as a downloadable artifact.
# It does NOT publish anything anywhere (no domain or hosting yet).
name: Webseite bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies to install. Builds the pages from Texte-und-Kontaktdaten.txt and checks
      # that every link and image resolves; the job fails (red) if not.
      - name: Webseite bauen
        run: npm run build:prod
      - name: Fertige Webseite als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: webseite
          path: dist/site
          if-no-files-found: error
          retention-days: 30
